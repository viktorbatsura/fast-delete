[package]
name = "fast-delete"
version = "0.1.0"
description = "Fast parallel folder deletion for Windows"
authors = ["Viktor Batsura"]
license = "MIT"
repository = "https://github.com/viktorbatsura/fast-delete"
edition = "2024"
rust-version = "1.85"

[lib]
name = "fast_delete_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
